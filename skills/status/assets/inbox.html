<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Status reports</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/inbox.css">
  <script src="/inbox.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div><h1>Status reports</h1><p class="subject">Reports from all agents and projects.</p></div>
      <p id="report-counts" class="meta" aria-live="polite">Shared collection</p>
    </header>
    <form class="collection-controls" role="search">
      <div class="collection-filter"><label id="report-view-label" for="report-view">Show</label><select id="report-view"><option value="inbox">Inbox</option><option value="dismissed">Dismissed</option><option value="all">All reports</option></select></div>
      <div class="collection-filter"><label id="report-project-label" for="report-project">Project</label><select id="report-project"><option value="">All projects</option></select></div>
      <label class="collection-search">Search<input id="report-search" type="search" placeholder="Title, agent, project, or provider"></label>
      <button id="refresh-reports" type="button">Refresh</button>
    </form>
    <div class="collection-feedback"><p id="report-feedback" role="status">Loading reports…</p><button id="undo-report" type="button" hidden>Undo</button></div>
    <p id="report-error" class="collection-error" role="alert" hidden></p>
    <p id="report-coverage" class="collection-note" hidden></p>
    <p id="report-empty" class="empty" hidden></p>
    <ol id="report-list" class="collection-list" aria-label="Generated status reports"></ol>
    <noscript><p class="notice">Enable JavaScript to view the collection and dismiss reports. Individual HTML reports remain readable without it.</p></noscript>
    <footer><span>STATUS / REPORT COLLECTION</span><span>Reports retain their original observation times.</span></footer>
  </main>
</body>
</html>
